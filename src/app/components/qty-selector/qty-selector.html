<div class="flex items-center gap-3">
  <div class="inline-flex items-center">
    <button
      matIconButton
      [disabled]="quantity() === 1"
      (click)="qtyUpdated.emit(this.quantity() - 1)"
    >
      <mat-icon>remove</mat-icon>
    </button>
    <div class="px-3">{{ quantity() }}</div>
    <button matIconButton (click)="qtyUpdated.emit(this.quantity() + 1)">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
