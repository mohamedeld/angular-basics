<div appViewPanel>
  <h2 class="text-2xl font-bol mb-4">Order Summary</h2>
  <div class="space-y-3 text-lg pt-4">
    <div class="flex items-center justify-between">
      <span>Subtotal</span>
      <span>${{ subTotal }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span>Tax</span>
      <span>${{ tax() }}</span>
    </div>
    <div class="flex items-center justify-between border-t pt-3 font-bold">
      <span>Total</span>
      <span>${{ total() }}</span>
    </div>
  </div>
  <ng-content select="[actionButtons]" />
</div>
