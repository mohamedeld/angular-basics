<div class="flex items-center gap-2">
  <button
    matIconButton
    routerLink="/wishlist"
    [matBadge]="store.wishlistItems().length"
    [matBadgeHidden]="store.wishlistItems().length === 0"
  >
    <mat-icon> Favorite </mat-icon>
  </button>
  <button
    matIconButton
    routerLink="/cart"
    [matBadge]="store.cartCount()"
    [matBadgeHidden]="store.cartCount() === 0"
  >
    <mat-icon>shopping_cart</mat-icon>
  </button>
  <button matButton>Sign In</button>
  <button matButton="filled">Sign Up</button>
</div>
