<div class="flex items-center gap-2">
  <button
    matIconButton
    routerLink="/wishlist"
    [matBadge]="store.wishlistItems().length"
    [matBadgeHidden]="store.wishlistItems().length === 0"
  >
    <mat-icon> Favorite </mat-icon>
  </button>

  <button
    matIconButton
    routerLink="/cart"
    [matBadge]="store.cartCount()"
    [matBadgeHidden]="store.cartCount() === 0"
  >
    <mat-icon>shopping_cart</mat-icon>
  </button>
  @if (store.currentUser()) {
    <button matIconButton [matMenuTriggerFor]="userMenu">
      <img class="w-8 h-8 rounded-full" />
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="flex flex-col px-3 min-w-[200px]">
        <span class="text-sm font-medium">{{ store.currentUser()?.name }}</span>
        <span class="text-sm font-medium">{{ store.currentUser()?.email }}</span>
      </div>
      <mat-divider></mat-divider>
      <button class="!min-h-[32px]" mat-menu-item (click)="store.signOut()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-menu>
  }
  <button matButton>Sign In</button>
  <button matButton="filled">Sign Up</button>
</div>
