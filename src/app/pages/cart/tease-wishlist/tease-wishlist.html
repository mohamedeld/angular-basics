<div appViewPanel class="flex items-center justify-between mb-3">
  <div class="flex items-center gap-3">
    <mat-icon class="text-red-500!">favorite_border</mat-icon>
    <div>
      <h2 class="text-xl font-bold">WishList {{ store.wishlistItems().length }}</h2>
      <p class="text-gray-500 text-sm">
        You have {{ store.wishlistItems().length }} items saved for later
      </p>
    </div>
  </div>
  @if (store.wishlistItems().length > 0) {
    <div class="flex items-center gap-3">
      <button matButton routerLink="/wishlist">View All</button>
      <button
        matButton="filled"
        class="flex items-center gap-2"
        (click)="store.addAllWishlistToCart()"
      >
        <mat-icon>shopping_cart</mat-icon>
        Add All To Cart
      </button>
    </div>
  }
</div>
