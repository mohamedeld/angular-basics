<div class="grid grid-cols-[3fr_1fr_1fr] items-center">
  <div class="flex items-center gap-4">
    <img
      [src]="cartItem()?.product?.imageUrl"
      [alt]="cartItem()?.product?.name"
      class="w-24 h-24 rounded-lg object-cover"
    />
    <div>
      <div class="text-gray-900 text-lg font-semibold">{{ cartItem()?.product?.name }}</div>
      <div class="text-gray-600 text-lg">${{ cartItem()?.product?.price }}</div>
    </div>
  </div>
  <app-qty-selector
    [quantity]="cartItem()?.quantity ?? 1"
    (qtyUpdated)="store.updateCartQuantity(cartItem()?.product.id, $event)"
  />
  <div class="flex flex-col items-end">
    <div class="text-right font-semibold text-lg">${{ total() }}</div>
    <div class="flex -me-3">
      <button
        matIconButton
        (click)="store.toggleWishList(cartItem()?.product)"
        [class]="isInWishlist() ? 'text-red-500' : 'text-gray-500'"
      >
        <mat-icon [class]="isInWishlist() ? 'text-red-500' : 'text-gray-500'"
          >favorite_border</mat-icon
        >
      </button>
      <button matIconButton class="danger" (click)="store.removeFromCart(cartItem()?.product?.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>
