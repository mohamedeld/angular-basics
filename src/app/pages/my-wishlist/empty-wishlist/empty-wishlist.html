<div class="flex min-h-[60vh] flex-col items-center justify-center px-4 text-center">
  <div class="mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-red-50">
    <mat-icon class="!h-12 !w-12 !text-[48px] !leading-none !text-red-500">
      favorite_border
    </mat-icon>
  </div>

  <h2 class="mb-3 text-2xl font-bold text-gray-900">Your Wishlist is Empty</h2>

  <p class="mb-8 max-w-md text-sm leading-relaxed text-gray-500">
    You haven't added any products to your wishlist yet. Explore our collection and save your
    favorite items for later!
  </p>

  <button matButton="filled" class="!rounded-lg !px-6 !py-3" (click)="continueShopping()">
    <mat-icon>shopping_bag</mat-icon>
    Continue Shopping
  </button>
</div>
